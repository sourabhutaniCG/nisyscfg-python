name: Analyze package

on:
  workflow_call:
    inputs:
      package-name:
        description: 'The name of the package folder to analyze.'
        default: ''
        required: true
        type: string
      package-basepath:
        description: 'The base path of the package to analyze, relative to the repo root.'
        default: ''
        required: true
        type: string
      install-extras:
        description: 'A space-separated list of package extras to install.'
        default: ''
        required: false
        type: string

permissions: {}

jobs:
  analyze_package:
    name: Analyze package for ${{ inputs.package-name }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]  # Temporarily disabled: macos-latest
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t', '3.15']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Set the working-directory for all steps in this job.
        working-directory: ${{ inputs.package-basepath }}
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python
        uses: ni/python-actions/setup-python@aa64e60612cb078b0c2ada666becbd70d4817d55 # v0.7.1
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@aa64e60612cb078b0c2ada666becbd70d4817d55 # v0.7.1
      - name: Analyze Python Project
        uses: ni/python-actions/analyze-project@aa64e60612cb078b0c2ada666becbd70d4817d55 # v0.7.1
        with:
          project-directory: ${{ github.workspace }}/${{ inputs.package-basepath }}
          install-args: ${{ inputs.install-extras && format('--extras ''{0}''', inputs.install-extras) || '' }}
      - name: Bandit security checks
        run:  poetry run bandit -c pyproject.toml -r src/
        working-directory: ${{ github.workspace }}/${{ inputs.package-basepath }}